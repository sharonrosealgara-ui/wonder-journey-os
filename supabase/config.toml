# Wonder Journey OS — Local Supabase Configuration
# Used by `supabase start` for local development and CI testing

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false
