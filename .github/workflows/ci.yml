name: CI Verification & Quality Gates

on:
  push:
    branches:
      - integration/curriculum-jul-dec-2026
      - main
  pull_request:
    branches:
      - integration/curriculum-jul-dec-2026
      - main

permissions:
  contents: read

jobs:
  stage-12-quality-gates:
    name: Stage 12.1R.10 Quality & 30 Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      LIVEKIT_URL: ws://127.0.0.1:7880
      NEXT_PUBLIC_LIVEKIT_WS_URL: ws://127.0.0.1:7880

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Ephemeral Masked Credentials
        run: |
          node -e '
            const crypto = require("crypto");
            const tPass = "Tchr_" + crypto.randomBytes(12).toString("hex") + "!9A";
            const fPass = "Fmly_" + crypto.randomBytes(12).toString("hex") + "!9A";
            const lkKey = "lk_key_" + crypto.randomBytes(8).toString("hex");
            const lkSec = "lk_sec_" + crypto.randomBytes(24).toString("hex");
            const gameSec = "game_sec_" + crypto.randomBytes(24).toString("hex");

            console.log("::add-mask::" + tPass);
            console.log("::add-mask::" + fPass);
            console.log("::add-mask::" + lkKey);
            console.log("::add-mask::" + lkSec);
            console.log("::add-mask::" + gameSec);

            const fs = require("fs");
            const envFile = process.env.GITHUB_ENV;
            fs.appendFileSync(envFile, `E2E_TEACHER_PASSWORD=${tPass}\n`);
            fs.appendFileSync(envFile, `E2E_FAMILY_PASSWORD=${fPass}\n`);
            fs.appendFileSync(envFile, `LIVEKIT_API_KEY=${lkKey}\n`);
            fs.appendFileSync(envFile, `LIVEKIT_API_SECRET=${lkSec}\n`);
            fs.appendFileSync(envFile, `GAME_EVALUATION_SECRET=${gameSec}\n`);
          '

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start Real Local Supabase Stack & Seed Database
        run: |
          supabase start
          STATUS_JSON=$(supabase status -o json)
          SUPABASE_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY')
          SERVICE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY')

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"

          echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV

          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_KEY" \
          node scripts/seed-local-database.js

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Download & Setup Official LiveKit Server
        run: node scripts/setup-livekit-server.js &

      - name: Run Secret Audit Negative Test Harness
        run: node scripts/test-secret-audit-negative.js

      - name: Run Tracked-File Secret & Environment Security Audit
        run: node scripts/test-secret-env-audit.js

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Curriculum & Unit Tests
        run: npm test

      - name: Run Classroom Protocol & Transport Unit Tests
        run: npx tsx tests/livekit-teacher-student-sync.test.ts

      - name: Run 130 Authentic Media Integrity & Provenance Audit
        run: node scripts/audit-all-130-media.js

      - name: Run Full 30 Release Candidate Verification Gates
        run: npm run validate:release

      - name: Generate CI Verification Evidence
        run: node scripts/generate-ci-evidence.js

      - name: Upload CI Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-evidence
          path: |
            artifacts/ci-verification-evidence.json
            artifacts/media-contact-sheet.json
            artifacts/media-contact-sheet.html
            artifacts/media-visual-review.json
            artifacts/screenshots/
