name: CI Verification & Quality Gates

on:
  push:
    branches:
      - integration/curriculum-jul-dec-2026
      - main
  pull_request:
    branches:
      - integration/curriculum-jul-dec-2026
      - main

permissions:
  contents: read

jobs:
  stage-12-quality-gates:
    name: Stage 12.1R.10 Quality & 30 Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4NzY4MDB9.CR-demo-anon-key-for-local-development
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4Mzg3NjgwMH0.EG-demo-service-role-key-for-local-development
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_URL: ws://127.0.0.1:7880
      NEXT_PUBLIC_LIVEKIT_WS_URL: ws://127.0.0.1:7880
      GAME_EVALUATION_SECRET: stage12-1r10-server-evaluation-secret-key-32bytes-ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start Real Local Supabase Stack & Apply Migrations
        run: |
          supabase start
          node scripts/seed-local-database.js

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Download & Setup Official LiveKit Server
        run: node scripts/setup-livekit-server.js &

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Curriculum & Unit Tests
        run: npm test

      - name: Run Classroom Protocol & Transport Unit Tests
        run: npx tsx tests/livekit-teacher-student-sync.test.ts

      - name: Run 130 Authentic Media Integrity & Provenance Audit
        run: node scripts/audit-all-130-media.js

      - name: Run Full 30 Release Candidate Verification Gates
        run: npm run validate:release

      - name: Generate CI Verification Evidence
        run: node scripts/generate-ci-evidence.js

      - name: Upload CI Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-evidence
          path: |
            artifacts/ci-verification-evidence.json
            artifacts/media-contact-sheet.json
            artifacts/media-contact-sheet.html
            artifacts/media-visual-review.json
            artifacts/screenshots/
