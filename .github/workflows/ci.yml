name: CI Verification & Quality Gates

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'integration/**'

jobs:
  verify:
    name: Stage 12.1R.6 Quality & 30 Release Gates
    runs-on: ubuntu-latest
    env:
      GAME_EVALUATION_SECRET: ${{ secrets.GAME_EVALUATION_SECRET || 'ci_default_game_evaluation_secret_key_2026_super_secure' }}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret1234567890123456
      LIVEKIT_URL: ws://127.0.0.1:7880
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Curriculum & Unit Tests
        run: npm test

      - name: Run Protocol & Unit Tests
        run: npx tsx tests/livekit-teacher-student-sync.test.ts

      - name: Run 130 Authentic Media Integrity & Provenance Audit
        run: npx tsx scripts/audit-all-130-media.js

      - name: Run Full 30 Release Candidate Verification Gates
        run: npm run validate:release

      - name: Run Playwright E2E Two-Context Suite
        run: |
          npx playwright install --with-deps chromium
          node scripts/run-playwright-e2e.js

      - name: Generate CI Verification Evidence
        run: node scripts/generate-ci-evidence.js
